<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 60 60" width="100%" height="100%">
  <!-- Purple Card filling the entire viewport -->
  <rect x="20" y="20" width="60" height="60" rx="14" ry="14" fill="#6352d0"/>

  <!-- Lightning Bolt Icon with Glitch Effect -->
  <g transform="translate(0,0)">
    <!-- Cyan/Blue Left/Top Shadow Edge -->
    <path d="M 53 30 L 41 48 H 50 L 46 68 L 60 46 H 50 Z" fill="#3bbbf8" opacity="0.8" transform="translate(-1.2, 0)"/>
    
    <!-- Magenta/Pink Right/Bottom Shadow Edge -->
    <path d="M 53 30 L 41 48 H 50 L 46 68 L 60 46 H 50 Z" fill="#f43f5e" opacity="0.8" transform="translate(1.2, 0)"/>
    
    <!-- Main White Lightning Bolt -->
    <path d="M 53 30 L 41 48 H 50 L 46 68 L 60 46 H 50 Z" fill="#ffffff"/>
  </g>
</svg>
